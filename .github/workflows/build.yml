name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test LTFS.WinFsp.sln -c Release
      - run: dotnet test tests/LTFS.WinFsp.Windows.Tests -c Release
      - run: dotnet test tests/HpeReadProbe.Tests -c Release
